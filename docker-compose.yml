services:
  postgres:
    image: postgres:16-alpine
    container_name: collabarch-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-collabarch}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: collabarch-redis
    restart: always
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
